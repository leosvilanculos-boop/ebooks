services:
  - type: web
    name: ebooks-checkout
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WALLED_API_BASE_URL
        sync: false
      - key: WALLED_APP_ORIGIN
        sync: false
      - key: WALLED_API_KEY
        sync: false
      - key: WALLED_WEBHOOK_SECRET
        sync: false
      - key: WALLED_VARIABLE_PRICING
        value: "false"
      - key: WALLED_FIXED_PRODUCTS_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
